<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:920px; height:640px; background:#f6f7f9; font-family:"Microsoft YaHei",sans-serif; }
  .card { margin:30px auto; width:780px; background:#fff; border-radius:16px;
           box-shadow:0 4px 18px rgba(0,0,0,0.08); padding:36px 42px; }
  .title { font-size:18px; font-weight:600; color:#333; margin-bottom:6px; }
  .sub { font-size:12px; color:#999; margin-bottom:20px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .cell { background:#f2f5ff; border-radius:10px; padding:12px 14px; }
  .label { font-size:11px; color:#7a8bb0; margin-bottom:8px; }
  .value { font-size:20px; font-weight:700; color:#1f2d4d; }
  .foot { margin-top:20px; font-size:12px; color:#bbb; text-align:right; }
</style></head>
<body><div class="card">
  <div class="title">笔记数据 · 近 7 天</div>
  <div class="sub">数据更新时间：今日 09:00 ｜ 版式：compact</div>
  <div class="grid"><div class="cell"><div class="label">曝光量</div><div class="value">100万</div></div><div class="cell"><div class="label">点赞</div><div class="value">10万</div></div><div class="cell"><div class="label">收藏</div><div class="value">5万</div></div><div class="cell"><div class="label">评论</div><div class="value">1万</div></div><div class="cell"><div class="label">分享</div><div class="value">5000</div></div><div class="cell"><div class="label">涨粉</div><div class="value">2万</div></div></div>
  <div class="foot">（合成夹具 · benchmark）</div>
</div></body></html>
